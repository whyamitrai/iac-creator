name: CI

on:
  push:
    branches: [main]
  pull_request:
    brances: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 backend/ frontend/ --max-line-length=120 --ignore=E501,W503
        
      - name: Build Docker image
        run: docker build -t iac-creator .